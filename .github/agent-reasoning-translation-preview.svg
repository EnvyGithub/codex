<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="AgentReasoning bilingual preview">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .window { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .titlebar { fill: #161b22; }
      .text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          "Noto Sans Mono CJK SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei UI", monospace;
        font-size: 16px;
        fill: #c9d1d9;
      }
      .dim { fill: #8b949e; }
      .accent { fill: #58a6ff; }
      .ok { fill: #3fb950; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="960" height="340" />
  <rect class="window" x="20" y="20" width="920" height="300" rx="12" />
  <rect class="titlebar" x="20" y="20" width="920" height="38" rx="12" />
  <circle cx="44" cy="39" r="6" fill="#ff5f57" />
  <circle cx="64" cy="39" r="6" fill="#febc2e" />
  <circle cx="84" cy="39" r="6" fill="#28c840" />
  <text class="text dim" x="110" y="44">codex tui • AgentReasoning translation (external command)</text>

  <text class="text" x="44" y="92">
    Thinking <tspan class="dim">(思考中)</tspan>
  </text>

  <text class="text dim" x="44" y="126">
    <tspan class="bold">Plan</tspan> (original)
  </text>
  <text class="text" x="44" y="152">- Parse ~/.codex/config.toml</text>
  <text class="text" x="44" y="176">- Run translator via stdin/stdout JSON</text>

  <text class="text dim" x="44" y="212">└ <tspan class="bold">计划</tspan> (译文)</text>
  <text class="text" x="66" y="238">- 解析 ~/.codex/config.toml</text>
  <text class="text" x="66" y="262">- 通过 stdin/stdout JSON 调用外部翻译器</text>

  <text class="text dim" x="44" y="300">
    说明：译文异步追加；失败会显示原因（不影响主流程）
  </text>
</svg>

